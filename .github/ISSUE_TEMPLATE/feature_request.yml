name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, `.p8` contents, JWTs, local MCP bearer tokens, Keychain data, or private App Store Connect information.

  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the task or limitation you encountered.
      placeholder: I need to ... because ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like ASC Bridge to do?
      description: Describe the behavior you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have considered.
    validations:
      required: false

name: Bug report
description: Report a reproducible problem with ASC Bridge.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, follow the private reporting process in `SECURITY.md`; do not open a public issue.

        Never include `.p8` contents, API keys, JWTs, local MCP bearer tokens, Keychain data, or full audit logs. Share only redacted details needed to reproduce the problem.

  - type: input
    id: app-version
    attributes:
      label: ASC Bridge version
      description: The app version or commit you are using.
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "e.g. macOS 15.5"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem. Include only redacted, minimal error details if useful.
      placeholder: What did you see?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps that reliably reproduce the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: false
